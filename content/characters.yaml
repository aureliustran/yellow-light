# Nhân vật Đèn Vàng – nguồn dữ liệu duy nhất cho modal (web Vercel) và ghi chú dưới chương (bản phụ).
# Cập nhật 13/10/2026, phủ đến 38-chuong-37-ba-tram-sau-muoi-do. 33 card.
#
# Quy ước:
# - from: slug chương (tên file không có .md) mở nấc hồ sơ này. Thứ tự theo thứ tự chương trên site.
# - name ở cấp stage (nếu có) ghi đè tên nhân vật cho nấc đó (dùng khi người đọc chưa biết tên thật).
# - hideFrom: từ chương này trở đi không hiện card này nữa (đã gộp vào card khác).
# - quote: nguyên văn trong truyện, của chính nhân vật (hoặc ý nghĩ của họ).
# - group: chinh | quanh-thuyen | lab | nha-nhi | qua-khu (thứ tự hiển thị trong modal).

- id: thuyen
  name: "Thuyên"
  group: chinh
  image: /characters/thuyen.webp
  stages:
    - from: 03-chuong-01-den-vang
      role: "Sinh viên năm ba Khoa học Máy tính, Đại học Công nghệ"
      bio: "Hai mươi tuổi, quê Hà Tĩnh, dân chuyên Toán, giải Nhì quốc gia môn Tin, IELTS 8.0, vừa hết sáu tháng thực tập. Sáng nào cũng ném bóng ở sân khu tập thể. Nói chuyện được với tất cả mọi người, và chưa để ai thấy mình thật sự nghĩ gì."
      quote: "Thôi, quả cuối mà trượt thì chưa tính là quả cuối."
    - from: 10-chuong-08-san-khau
      role: "Diễn giả sinh viên ở Vietnam Future Tech Summit 2026"
      bio: "Đọc khán phòng trước khi lên sân khấu, biết chỗ nào người ta sẽ cười. Polo hàng Quảng Châu, đứng xa ba mét là xịn."
      quote: "Lên sân khấu thì không ai nhớ cái áo giống mọi người cả."
    - from: 16-chuong-13-buoi-hoc-dau
      role: "Sinh viên năm ba, gia sư IELTS của Nhi"
      bio: "Quy mọi thứ ra bát bún riêu. Dạy bằng một cái khung duy nhất: chấm, vì sao, ví dụ, quay về."
    - from: 17-chuong-14-ngay-dau
      role: "Kỹ sư part-time ở lab R&D Thiên Nhãn, tầng 17"
      bio: "Sinh viên năm ba duy nhất được ký hợp đồng. Ngồi ở bàn của người cũ, cái cốc vẫn in chữ ĐẠT. Người duy nhất cầm cái đầu con voi mà cả lab chỉ sờ được từng phần."
    - from: 27-chuong-24-mieng-banh
      bio: "Kết quả mạnh đầu tiên của dự án là của anh, và lời khen thì về tay người khác. Đứng giữa hai phe, lần đầu anh thấy cả hai cùng nghi mình."
      quote: "Gà cũng cần sổ đỏ."
    - from: 36-chuong-35-hai-muoi-tam-quan
      role: "Người cầm phần lõi của dự án"
      bio: "Dự án sắp sang giai đoạn vận hành, danh sách nhân sự chỉ có vài ghế. Anh nhận ra không có chỗ đứng ngoài."
      quote: "Mình không chơi thì mình là bàn cờ."

- id: nhi
  name: "Nhi"
  group: chinh
  image: /characters/nhi.webp
  stages:
    - from: 03-chuong-01-den-vang
      name: "Cô gái đi Vespa hồng"
      role: "Người đâm vào xe Thuyên ở đèn vàng"
      bio: "Không đòi tiền, không đòi đền. Chỉ đòi anh nhận lỗi."
    - from: 05b-hong-phan
      role: "Cô gái đi Vespa hồng ở chương 1, sinh viên năm hai Quản trị kinh doanh ở RMIT"
      bio: "Chiếc Vespa hồng là quà anh trai tặng hôm có giấy báo đỗ, tuần nào cũng lau dù không có vết xước nào. Giữ một ghi chú tên là \"Những lần mình đúng mà không ai nhường\"."
    - from: 10-chuong-08-san-khau
      role: "Cô gái áo len hồng, ghế VIP hàng đầu"
      bio: "Ngồi giữa một hàng vest đen và xám. Hỏi diễn giả sinh viên một câu không ai dám hỏi."
      quote: "Bài nói rất hay. Anh có tin câu nào trong đó không?"
    - from: 16-chuong-13-buoi-hoc-dau
      role: "Học sinh IELTS của Thuyên"
      bio: "Mang theo xấp giáo án của ba gia sư cũ và một cuốn sổ hồng tự ghi lỗi sai gần một năm. Nói chuyện như ném đá. Người duy nhất Thuyên không đọc được."
    - from: 21b-anh-xanh-man-hinh
      bio: "Em gái anh Khải. Lần đầu nói dối anh trai: bảo là mình đi nhầm thang máy."
    - from: 26-chuong-23-san-sang
      quote: "Anh đẹp trai thật. Tiếc là mồm hơi thối."

- id: diep-anh
  name: "Diệp Anh"
  group: chinh
  image: /characters/diep-anh.webp
  stages:
    - from: 15-chuong-12-chu-toa
      role: "Sinh viên năm cuối Học viện Ngoại giao, chủ tọa hội nghị Mô phỏng Liên Hợp Quốc"
      bio: "Son đỏ kẻ như thước, đi vào phòng như người đã biết trước cả phòng sẽ nhìn. Người đầu tiên đọc được Thuyên trước khi anh kịp đọc cô. Ảnh nào có cô, cô cũng đứng giữa."
      quote: "Hành lang cũng là sân của chị."
    - from: 24-chuong-21-dem-nguoc
      role: "Người yêu của Thuyên"
      bio: "Người hỏi \"mình là gì của nhau\" năm giây trước khi pháo hoa nổ. Ở cạnh cô, Thuyên không phải hạ tốc độ. Với cả thế giới anh cứng, với cô anh nũng."

- id: vu
  name: "Vũ"
  group: chinh
  image: /characters/vu.webp
  stages:
    - from: 03-chuong-01-den-vang
      name: "Vũ Béo"
      role: "Bạn thân của Thuyên"
      bio: "Bạn thân từ năm nhất, người Hà Nội gốc, nhà ở khu tập thể có sân bóng. Chủ chiếc Wave đời cũ. Chửi bậy như hát, ngủ nướng như làm nghĩa vụ, gọi Thuyên là \"idol\" với giọng mỉa."
    - from: 12-chuong-09-den-san-khong-tat
      bio: "Đêm sau summit, giơ tấm bìa thùng mì tôm \"CHÀO MỪNG IDOL\" ở sân. Người duy nhất Thuyên đọc được hết mà không thấy mệt."
    - from: 23-chuong-20-san-bong
      quote: "Nhưng mà… chị ấy nhìn sân như nhìn chỗ tổ chức sự kiện."
    - from: 26-chuong-23-san-sang
      quote: "Lúc lên sân khấu là nó kể bản đẹp. Anh có bản gốc."

- id: khai
  name: "Khải"
  group: chinh
  image: /characters/khai.webp
  stages:
    - from: 19-chuong-16-ban-do
      name: "Anh Khải"
      role: "Người ở tầng 18"
      bio: "Gặp Thuyên trong thang máy, thân thiện, kể chuyện máy cà phê tầng anh bị hỏng. Đọc phụ lục báo cáo của lab từng dòng một."
      quote: "Kỷ niệm mà quay logo ra ngoài."
    - from: 21b-anh-xanh-man-hinh
      role: "Anh trai Nhi, tầng 18"
      bio: "Người duy nhất trong nhà nghe Nhi nói hết câu, và là người dọn mọi chuyện cho cô."
      quote: "Lần sau mang lên thì gọi trước. Anh xuống sảnh lấy. Đỡ đi nhầm."
    - from: 21c-mau-be
      bio: "Hơn Nhi mười một tuổi. Người kế nghiệp mà bố giữ bên cạnh."
    - from: 37-chuong-36-ban-nhap
      role: "Giám đốc Khối Công nghệ, tầng 18"
      bio: "Văn phòng của anh gửi email riêng cho Thuyên, không qua trưởng nhóm."

- id: anh-trai-nhi
  name: "Anh trai Nhi"
  group: nha-nhi
  image: /characters/khai.webp
  hideFrom: 21b-anh-xanh-man-hinh
  stages:
    - from: 06b-mau-giay-can
      role: "Anh trai Nhi"
      bio: "Ở bàn ăn, người duy nhất hạ giọng hỏi tiếp khi Nhi kể chuyện. Hỏi cả tên anh sinh viên ở đèn vàng."
    - from: 09b-kem-vien-nhu-vang
      bio: "Một cuộc điện thoại hai mươi giây là có tấm thiệp mới."
      quote: "Lần này đừng để anh phải dọn."
    - from: 10b-hong-dat
      bio: "Ngồi cạnh Nhi ở ghế VIP summit, vest xám, không cười."

- id: tuan
  name: "Anh Tuấn"
  group: lab
  image: /characters/tuan.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Trưởng lab R&D Thiên Nhãn"
      bio: "Gọi mọi người mới là \"nhân tố đột phá\". Lo tầm nhìn, chi tiết để \"mấy đứa triển khai\" nắm. Khen người như soi gương, ai đứng trước lời khen của anh cũng thấy mặt anh."
    - from: 18-chuong-15-du-thinh
      quote: "Đấy. Khiêm tốn. Anh thích người khiêm tốn."

- id: bao
  name: "Anh Bảo"
  group: lab
  image: /characters/bao.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Kỹ sư trưởng"
      bio: "Đeo tai nghe, nói đều như đọc thông số. Khinh sếp vì sếp không hiểu kỹ thuật."
    - from: 22-chuong-19-hiep-hai
      bio: "Rủ Thuyên đi bia hơi, ngồi gần như im cả buổi, đến cốc cuối mới nói một câu. Từ hôm ấy gọi Thuyên là \"chú\"."
      quote: "Màu xấu thế, cả lab chỉ có chú."
    - from: 27-chuong-24-mieng-banh
      quote: "Ở đây không có ghế ở giữa đâu em."

- id: hanh
  name: "Chị Hạnh"
  group: lab
  image: /characters/hanh.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Điều phối dự án, \"bộ não điều phối\""
      bio: "Cầu nối giữa lab, sếp và các khối. Bàn ăn trưa của chị là chỗ người mới bị thử."
    - from: 37-chuong-36-ban-nhap
      quote: "Có chuyện gì em cần chị nói với ai thì bảo chị nhé."

- id: phuong
  name: "Chị Phương"
  group: lab
  image: /characters/phuong.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Trưởng nhóm gán nhãn và vận hành dữ liệu"
      bio: "Quản lý thực tập sinh. Việc thừa của nhóm thường đi về một góc cửa sổ."
      quote: "Đủ người em ạ."

- id: ngan
  name: "Chị Ngân"
  group: lab
  image: /characters/ngan.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Trợ lý của anh Tuấn"
      bio: "Ngồi sát phòng sếp, gõ biên bản không đổi nhịp. \"Không có Ngân anh chết\", lời sếp giới thiệu."

- id: tram
  name: "Trâm"
  group: lab
  image: /characters/tram.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Phụ trách đối tác"
      bio: "Mượn từ khối kinh doanh. Hay nhìn ra cửa sổ khi sếp nói."

- id: ha-my
  name: "Hà My"
  group: lab
  image: /characters/ha-my.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Truyền thông, \"gương mặt của Thiên Nhãn\""
      bio: "Mượn từ marketing. Mồm nhanh nhất bàn ăn trưa, biết góc nào của mặt mình đẹp nhất."
    - from: 37-chuong-36-ban-nhap
