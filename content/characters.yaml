      role: "Bạn cùng nhóm bài tập Economics của Nhi ở RMIT"
      bio: "Hay nhắn \"Nhi ơi\" lúc chín giờ tối hỏi bài, kèm một cái 🥺."
    - from: 35a-chuong-33-mixue
      bio: "Người Thuyên cứ ghép đôi với Nhi, ghép mãi."

- id: bo-thuyen
  name: "Bố"
  group: qua-khu
  image: /characters/bo-thuyen.webp
  stages:
    - from: 04-chuong-02-bao-giay-vun
      role: "Bố Thuyên, công chức ở huyện"
      bio: "Nghiêm, ít lời. Vứt cuốn sách vũ trụ đầu tiên của con vào bao giấy vụn. Những đêm mất điện thì lên sân thượng chỉ cho con Sao Hôm."
    - from: 05-chuong-03-tieng-dep
      bio: "Không nói ra lời khen nào. Hôm con đỗ chuyên, lặng lẽ mua cho con một cái Casio."
    - from: 33-chuong-30-phi-thuyen
      bio: "Gửi theo xe khách ra Hà Nội một chiếc Air Blade màu xanh midnight."

- id: ma-thuyen
  name: "Mạ"
  group: qua-khu
  image: /characters/ma-thuyen.webp
  stages:
    - from: 04-chuong-02-bao-giay-vun
      role: "Mẹ Thuyên"
      bio: "Chiều thứ Bảy nào cũng lau cái tủ kính để giấy khen giữa nhà, kỹ hơn lau bàn thờ."
    - from: 05-chuong-03-tieng-dep
      bio: "Gọi điện tối Chủ nhật, giọng Hà Tĩnh. Hay nhắc đến con trai bác Hùng."

- id: nam
  name: "Nam"
  group: qua-khu
  image: /characters/nam.webp
  stages:
    - from: 05-chuong-03-tieng-dep
      role: "Con trai bác Hùng hàng xóm, hơn Thuyên một tuổi"
      bio: "\"Con nhà người ta\" của cả tuổi thơ Thuyên. Cái tên được nhắc ở nhà Thuyên nhiều hơn cần."

- id: thay-quang
  name: "Thầy Quang"
  group: qua-khu
  image: /characters/thay-quang.webp
  stages:
    - from: 06-chuong-04-san-tro
      role: "Thầy dạy Tin cấp ba"
      bio: "Tóc lúc nào cũng bù xù, không bao giờ trả lời thẳng câu hỏi nào. Người đưa cho Thuyên chìa khóa phòng máy."
      quote: "Câu hay. Em tự tìm hiểu rồi kể thầy nghe."

- id: anh-long
  name: "Anh Long"
  group: qua-khu
  image: /characters/anh-long.webp
  stages:
    - from: 06-chuong-04-san-tro
      role: "Đàn anh ở sân bóng rổ cấp ba"
      bio: "Mê một tay hậu vệ người Mỹ cầm bóng như có dây buộc. Dạy Thuyên chơi bóng, và dạy luôn cách mặc."

- id: vy
  name: "Vy"
  group: qua-khu
  image: /characters/vy.webp
  stages:
    - from: 06-chuong-04-san-tro
      role: "Bạn cùng khối, chuyên Anh"
      bio: "Cả trường biết Vy. Năm nào cũng dẫn chương trình văn nghệ. Một ngày bắt đầu đứng ở rìa sân bóng."
    - from: 08-chuong-06-ghe-da
      quote: "Anh có bao giờ thật sự thích em không?"

- id: me-nhi
  name: "Mẹ Nhi"
  group: nha-nhi
  image: /characters/me-nhi.webp
  stages:
    - from: 05b-hong-phan
      role: "Mẹ Nhi"
      bio: "Nhi hỏi đèn vàng thì phải dừng hay đi, mẹ trả lời bằng một câu không phải câu trả lời."
      quote: "Mẹ có đi xe đâu. Lái xe đi đâu thì mẹ ngồi đằng sau."
    - from: 06b-mau-giay-can
      bio: "Trong phòng bố mẹ có một ống đựng bản vẽ mang tên bà. Cánh tủ đóng lại rất khẽ."

- id: bo-nhi
  name: "Bố Nhi"
  group: nha-nhi
  image: /characters/bo-nhi.webp
  stages:
    - from: 06b-mau-giay-can
      role: "Bố Nhi"
      bio: "Ở bàn ăn chỉ nói chuyện công ty. Nghe Nhi kể chuyện đâm xe, chỉ hỏi \"có đòi tiền không\"."
    - from: 10b-hong-dat
      role: "Nhà tài trợ kim cương của summit"
      bio: "Phát biểu năm phút, đọc từ giấy, ba lần nhắc đến tên tập đoàn."
    - from: 21c-mau-be
      quote: "Thằng lớn thì theo tôi. Còn con bé thì sau này lấy được chồng tử tế là tôi mừng."
