let moved = false;
cv.addEventListener('pointermove', e => {
  if (drag) { [drag.x, drag.y] = toW(e.clientX,e.clientY); moved = true; }
  else if (pan) { cam.x = pan.cx - (e.clientX-pan.x)/cam.k; cam.y = pan.cy - (e.clientY-pan.y)/cam.k; moved = true; }
  else hover = pick(e.clientX,e.clientY);
});
cv.addEventListener('pointerup', e => { if (!moved) select(pick(e.clientX,e.clientY)); drag = null; pan = null; cv.style.cursor = 'grab'; });
cv.addEventListener('wheel', e => { e.preventDefault(); const k = Math.exp(-e.deltaY*0.0012); const [wx,wy] = toW(e.clientX,e.clientY); cam.k = Math.max(.25, Math.min(5, cam.k*k)); const [nx,ny] = toW(e.clientX,e.clientY); cam.x += wx-nx; cam.y += wy-ny; }, { passive:false });

function select(n) {
  sel = n; const el = document.getElementById('info');
  if (!n) { el.style.display = 'none'; return; }
  const st = stateAt(n);
  const nb = [...nbr.get(n.id)].map(id => byId.get(id)).sort((a,b) => a.id.localeCompare(b.id));
  const w = Object.entries(n.weight || {}).map(([k,v]) => k+' '+v).join(' · ');
  el.style.display = 'block';
  el.innerHTML = `<h3></h3><code></code><div style="margin-top:6px;color:var(--mut)"></div><ul></ul>`;
  el.querySelector('h3').textContent = n.id;
  el.querySelector('code').textContent = 'docs/' + n.path;
  el.children[2].textContent = [n.kind, n.status, n.effective && ('hiệu lực ' + n.effective), w && ('mức ' + w), !st.active && '(không hoạt động ở giai đoạn này)'].filter(Boolean).join(' · ');
  const ul = el.querySelector('ul');
  for (const m of nb) { const li = document.createElement('li'); li.textContent = m.id; li.onclick = () => { select(m); [cam.x, cam.y] = [m.x, m.y]; }; ul.appendChild(li); }
  if (!nb.length) { const li = document.createElement('li'); li.style.cursor='default'; li.textContent = 'chưa nối với ai'; ul.appendChild(li); }
}

// giao diện
const phBox = document.getElementById('phases');
['all', ...PH].forEach(p => { const b = document.createElement('button'); b.textContent = p === 'all' ? 'Tất cả' : p; b.setAttribute('aria-pressed', p === phase); b.onclick = () => { phase = p; [...phBox.children].forEach(x => x.setAttribute('aria-pressed', x === b)); stat(); if (sel) select(sel); }; phBox.appendChild(b); });
function stat() { const act = nodes.filter(n => stateAt(n).active).length; document.getElementById('stat').textContent = `${act}/${nodes.length} nút · ${edges.length} cạnh · sinh ${DATA.generated}`; }
stat();
const lg = document.getElementById('legend');
const used = new Set(nodes.map(n => n.layer));
lg.innerHTML = Object.entries(LAYER).filter(([k]) => used.has(k)).map(([k,[c,t]]) => `<div><i style="background:${c}"></i>${t}</div>`).join('')
  + '<div style="margin-top:6px"></div>' + Object.entries(EDGE).filter(([k]) => edges.some(e => e.type === k)).map(([k,[c,t]]) => `<div><s style="border-color:${c}"></s>${t}</div>`).join('');
</script>
</body>
