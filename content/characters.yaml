    - from: 10-chuong-08-san-khau
      quote: "Ông nói hay đấy :))"

- id: thay-binh
  name: "Thầy Bình"
  group: quanh-thuyen
  image: /characters/thay-binh.webp
  stages:
    - from: 03-chuong-01-den-vang
