    - from: 10-chuong-08-san-khau
      quote: "Mang hai cái chưa?"

- id: bac-bao-ve
  name: "Bác bảo vệ"
  group: quanh-thuyen
  image: /characters/bac-bao-ve.webp
  stages:
    - from: 03-chuong-01-den-vang
