name: Daily digest

# Every day at 08:00 Vietnam time: if there are open comment reports, new
# comments, a burst of ratings from one reader, or a sudden jump in readers,
# open a GitHub issue with a short summary. GitHub emails the repo owner about
# new issues. On a quiet day nothing is posted.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build digest
        if: steps.secrets.outputs.ok == 'true'
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/digest.mjs > digest.md

      - name: Open an issue if there is something to report
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s digest.md ]; then
            echo "Nothing to report."
            exit 0
          fi
          gh label create digest --description "Daily admin digest" --color FBCA04 --force
          gh issue create --title "Tóm tắt $(TZ=Asia/Ho_Chi_Minh date +%F)" --body-file digest.md --label digest
