      role: "Một cái tên trong danh bạ của Nhi"
      bio: "Nửa đêm, ngón cái Nhi dừng trên cái tên ấy. Không bấm."

- id: thao
  name: "Thảo"
  group: lab
  image: /characters/thao.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Thực tập sinh"
      bio: "Ngồi góc cửa sổ, nhận việc của người khác mà không hỏi vì sao. Không ai gọi tên."
    - from: 20-chuong-17-viec-cua-thao
      bio: "Ở lại sau giờ làm, làm nốt phần của hai người khác, không được ghi tên."
    - from: 20b-xanh-co-vit
      role: "Thực tập sinh, sinh viên Kinh tế Quốc dân"
      bio: "Cái tên làm Nhi đánh rơi bút khi nghe Thuyên kể chuyện lab."
    - from: 24b-do-sam
      bio: "Từng học cùng trường với Nhi, trên Nhi một lớp, cùng đội tuyển hùng biện. Chuyển trường giữa năm lớp chín."
    - from: 27c-nau-ca-phe
      quote: "Tôi có bốn mươi phút."

