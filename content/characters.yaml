  group: lab
  image: /characters/quynh.webp
  stages:
    - from: 17-chuong-14-ngay-dau
      role: "Kỹ sư dữ liệu"
      bio: "Giỏi, không theo phe nào. Về đúng năm giờ rưỡi như đồng hồ báo thức."

- id: ly
  name: "Ly"
  group: lab
